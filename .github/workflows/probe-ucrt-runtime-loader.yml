name: Classify UCRT plugin and runtime DLL loading
on:
  push:
    branches: [ diagnose-ucrt-final-smoke ]
    paths: [ .github/workflows/probe-ucrt-runtime-loader.yml ]
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: mingw-w64-ucrt-x86_64-toolchain bash bzip2 tar
          update: true
          release: false
      - uses: actions/download-artifact@v4
        with:
          name: ucrt64-failed-installed-toolchain
          path: ${{ runner.temp }}/artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '36224783995'
      - shell: msys2 {0}
        run: |
          set -euo pipefail
          ROOT=$(cygpath -u "$RUNNER_TEMP")
          LOG=$ROOT/ucrt-runtime-loader.log
          : > "$LOG"
          {
            set -x
            mkdir -p "$ROOT/runtime-loader-tc" "$ROOT/runtime-loader-work/original" "$ROOT/runtime-loader-work/official"
            tar -xjf "$ROOT/artifact/ucrt64-failed-toolchain.tb2" -C "$ROOT/runtime-loader-tc"
            TC=$ROOT/runtime-loader-tc/x86_64-w64-mingw32-msys2
            RUNTIME=$TC/x86_64-w64-mingw32/runtime
            PLUGIN=$(find "$TC/libexec" -name liblto_plugin.dll -print -quit)
            OFFICIAL_PLUGIN=$(find /ucrt64/lib/gcc/x86_64-w64-mingw32 -name liblto_plugin.dll -print -quit)
            printf 'plugin=%s official=%s\n' "$PLUGIN" "$OFFICIAL_PLUGIN"
            test -f "$PLUGIN" && test -f "$OFFICIAL_PLUGIN"
            cd "$ROOT/runtime-loader-work"
            cat > loader.c <<'EOF'
          #include <windows.h>
          #include <stdio.h>
          int main(int argc,char **argv) {
            HMODULE h;
            if(argc!=2) return 2;
            SetErrorMode(SEM_FAILCRITICALERRORS|SEM_NOGPFAULTERRORBOX);
            h=LoadLibraryA(argv[1]);
            if(!h){printf("LoadLibrary %s error=%lu\n",argv[1],(unsigned long)GetLastError());return 3;}
            printf("LoadLibrary %s loaded\n",argv[1]);FreeLibrary(h);return 0;
          }
          EOF
            /ucrt64/bin/gcc.exe loader.c -o loader.exe
            for DLL in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll libgomp-1.dll; do
              cp -fp "$RUNTIME/$DLL" original/
              cp -fp "/ucrt64/bin/$DLL" official/
            done
            cp -fp "$PLUGIN" original/liblto_plugin.dll
            cp -fp "$OFFICIAL_PLUGIN" official/liblto_plugin.dll
            for KIND in original official; do
              for DLL in libwinpthread-1.dll libgcc_s_seh-1.dll libstdc++-6.dll libgomp-1.dll liblto_plugin.dll; do
                sha256sum "$KIND/$DLL"
                set +e
                ./loader.exe "$KIND/$DLL"
                STATUS=$?
                set -e
                printf '%s %s load status=%s\n' "$KIND" "$DLL" "$STATUS"
              done
            done
          } 2>&1 | tee "$LOG"
          exit ${PIPESTATUS[0]}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucrt-runtime-loader-log
          path: ${{ runner.temp }}/ucrt-runtime-loader.log
          if-no-files-found: warn
          retention-days: 14
