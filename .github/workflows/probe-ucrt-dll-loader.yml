name: Probe original UCRT DLL loader
on:
  push:
    branches: [ diagnose-ucrt-final-smoke ]
    paths: [ .github/workflows/probe-ucrt-dll-loader.yml ]
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: mingw-w64-ucrt-x86_64-toolchain bash bzip2 tar
          update: true
          release: false
      - uses: actions/download-artifact@v4
        with:
          name: ucrt64-failed-installed-toolchain
          path: ${{ runner.temp }}/artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '36224783995'
      - name: Compare original and official startup pair using Windows loader
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ROOT=$(cygpath -u "$RUNNER_TEMP")
          LOG="$ROOT/ucrt-dll-loader.log"
          : > "$LOG"
          {
            mkdir -p "$ROOT/dll-loader-tc" "$ROOT/dll-loader-probe"
            tar -xjf "$ROOT/artifact/ucrt64-failed-toolchain.tb2" -C "$ROOT/dll-loader-tc"
            TC="$ROOT/dll-loader-tc/x86_64-w64-mingw32-msys2"
            LIB="$TC/x86_64-w64-mingw32/lib"
            RUNTIME="$TC/x86_64-w64-mingw32/runtime"
            while IFS= read -r DIR; do
              if [ -f "$DIR/libgcc_s_seh-1.dll" ]; then
                cp -fp /ucrt64/bin/libgcc_s_seh-1.dll "$DIR/libgcc_s_seh-1.dll"
              fi
            done < <(find "$TC" -type f -iname '*.exe' -printf '%h\n' | sort -u)
            PLUGIN=$(find "$TC/libexec" -name liblto_plugin.dll -print -quit)
            HOST_PLUGIN=$(find /ucrt64/lib/gcc/x86_64-w64-mingw32 -name liblto_plugin.dll -print -quit)
            test -n "$PLUGIN" && test -n "$HOST_PLUGIN"
            cp -fp "$HOST_PLUGIN" "$PLUGIN"
            export PATH="$TC/bin:/usr/bin"
            unset CC CXX CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH GCC_EXEC_PREFIX COMPILER_PATH
            cd "$ROOT/dll-loader-probe"
            cp -p "$RUNTIME"/*.dll .
            for DLL in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
              cp -fp "/ucrt64/bin/$DLL" .
            done
            cat > shared.c <<'EOF'
          __declspec(dllexport) int shared_answer(void) { return 42; }
          EOF
            cat > client.c <<'EOF'
          #include <stdio.h>
          __declspec(dllimport) int shared_answer(void);
          int main(void) { if (shared_answer() != 42) return 1; puts("dll-ok"); return 0; }
          EOF
            cat > loader.c <<'EOF'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <stdio.h>
          typedef int (*answer_t)(void);
          int main(int argc, char **argv) {
            HMODULE dll;
            answer_t answer;
            if (argc != 2) return 2;
            SetErrorMode(SEM_FAILCRITICALERRORS | SEM_NOGPFAULTERRORBOX);
            dll = LoadLibraryA(argv[1]);
            if (!dll) { printf("LoadLibrary %s error=%lu\n", argv[1], (unsigned long)GetLastError()); return 3; }
            answer = (answer_t)(void *)GetProcAddress(dll, "shared_answer");
            if (!answer) { printf("GetProcAddress error=%lu\n", (unsigned long)GetLastError()); return 4; }
            printf("LoadLibrary %s answer=%d\n", argv[1], answer());
            FreeLibrary(dll);
            return 0;
          }
          EOF
            /ucrt64/bin/gcc.exe loader.c -o loader.exe
            echo 'original CRT object and archive hashes:'
            sha256sum "$LIB/dllcrt2.o" "$LIB/libmingw32.a"
            for KIND in original official; do
              if [ "$KIND" = official ]; then
                cp -fp /ucrt64/lib/dllcrt2.o /ucrt64/lib/libmingw32.a "$LIB/"
                echo 'official-pair diagnostic replacement hashes:'
                sha256sum "$LIB/dllcrt2.o" "$LIB/libmingw32.a"
              fi
              echo "--- $KIND pair ---"
              gcc.exe -fno-use-linker-plugin -shared shared.c -Wl,--out-implib,"lib$KIND.dll.a" -o "$KIND.dll"
              gcc.exe -fno-use-linker-plugin client.c -L. "-l$KIND" -o "$KIND-client.exe"
              echo 'DLL imports:'
              /ucrt64/bin/objdump.exe -p "$KIND.dll" | sed -n 's/.*DLL Name: //p' | sort -fu
              set +e
              ./loader.exe "$KIND.dll"
              LOAD_STATUS=$?
              ./"$KIND-client.exe"
              CLIENT_STATUS=$?
              set -e
              printf '%s loader status=%s client status=%s\n' "$KIND" "$LOAD_STATUS" "$CLIENT_STATUS"
            done
          } 2>&1 | tee "$LOG"
          exit ${PIPESTATUS[0]}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucrt64-dll-loader-log
          path: ${{ runner.temp }}/ucrt-dll-loader.log
          if-no-files-found: warn
          retention-days: 14
