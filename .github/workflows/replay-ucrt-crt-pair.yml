name: Test UCRT DLL startup pair
on:
  push:
    branches: [ diagnose-ucrt-final-smoke ]
    paths: [ .github/workflows/replay-ucrt-crt-pair.yml ]
permissions:
  actions: read
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: mingw-w64-ucrt-x86_64-toolchain bash bzip2 tar
          update: true
          release: false
      - uses: actions/download-artifact@v4
        with:
          name: ucrt64-failed-installed-toolchain
          path: ${{ runner.temp }}/artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '36224783995'
      - shell: msys2 {0}
        run: |
          set -euo pipefail
          ROOT=$(cygpath -u "$RUNNER_TEMP")
          WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE")
          LOG=$ROOT/crt-pair.log
          : > "$LOG"
          {
            mkdir -p "$ROOT/pair"
            tar -xjf "$ROOT/artifact/ucrt64-failed-toolchain.tb2" -C "$ROOT/pair"
            TC=$ROOT/pair/x86_64-w64-mingw32-msys2
            LIB=$TC/x86_64-w64-mingw32/lib
            RUNTIME=$TC/x86_64-w64-mingw32/runtime
            echo 'original CRT/runtime hashes:'
            sha256sum "$LIB/dllcrt2.o" "$LIB/libmingw32.a" "$RUNTIME"/*.dll
            while IFS= read -r DIR; do
              test ! -f "$DIR/libgcc_s_seh-1.dll" || cp -fp /ucrt64/bin/libgcc_s_seh-1.dll "$DIR/libgcc_s_seh-1.dll"
            done < <(find "$TC" -type f -iname '*.exe' -printf '%h\n' | sort -u)
            cp -fp "$(find /ucrt64/lib/gcc/x86_64-w64-mingw32 -name liblto_plugin.dll -print -quit)" "$(find "$TC/libexec" -name liblto_plugin.dll -print -quit)"
            cp -fp /ucrt64/lib/dllcrt2.o /ucrt64/lib/libmingw32.a "$LIB/"
            for DLL in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do cp -fp "/ucrt64/bin/$DLL" "$RUNTIME/$DLL"; done
            echo 'A/B CRT/runtime hashes:'
            sha256sum "$LIB/dllcrt2.o" "$LIB/libmingw32.a" "$RUNTIME"/*.dll
            bash -x "$WORKSPACE/mingw64-smoke.sh" "$TC"
          } 2>&1 | tee "$LOG"
          exit ${PIPESTATUS[0]}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucrt64-crt-pair-log
          path: ${{ runner.temp }}/crt-pair.log
          if-no-files-found: warn
