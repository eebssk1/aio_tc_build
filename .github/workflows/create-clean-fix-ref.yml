name: Create clean fix ref from pre-diagnostic baseline
on:
  push:
    branches: [ diagnose-ucrt-final-smoke ]
    paths: [ .github/workflows/create-clean-fix-ref.yml ]
permissions:
  contents: write
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create clean baseline ref without changing workflow files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exec > >(tee "$RUNNER_TEMP/create-clean-ref.log") 2>&1
          set -euo pipefail
          BASE=822de0e7f9ac1707868f6e94874cfcb9c34cfcf1
          BRANCH=fix/msys-native-toolchains-clean
          test "$(git rev-parse "$BASE^{commit}")" = "$BASE"
          test "$(git show -s --format=%s "$BASE")" = 'disable linker plugin in MinGW UTF-8 relocatable link'
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          base='822de0e7f9ac1707868f6e94874cfcb9c34cfcf1'
          name='fix/msys-native-toolchains-clean'
          url=f'https://api.github.com/repos/{repo}/git/refs/heads/{name}'
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as response:
                  raise RuntimeError(f'ref already exists: {json.load(response)["object"]["sha"]}')
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
          data=json.dumps({'ref':f'refs/heads/{name}','sha':base}).encode()
          request=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/refs',data=data,headers={**headers,'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request) as response:
              ref=json.load(response)
              print('created',ref['ref'],ref['object']['sha'])
              assert ref['object']['sha']==base
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-ref-create-log
          path: ${{ runner.temp }}/create-clean-ref.log
          if-no-files-found: warn
