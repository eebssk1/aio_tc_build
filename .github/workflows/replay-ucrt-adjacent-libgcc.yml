name: Replay UCRT64 host libgcc adjacency

on:
  push:
    branches: [ diagnose-ucrt-final-smoke ]
    paths: [ .github/workflows/replay-ucrt-adjacent-libgcc.yml ]

permissions:
  actions: read
  contents: read

jobs:
  adjacency:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: mingw-w64-ucrt-x86_64-toolchain mingw-w64-x86_64-toolchain bash bzip2 tar gmp-devel mpfr-devel mpc-devel isl-devel zlib-devel libzstd-devel
          update: true
          release: false
      - uses: actions/download-artifact@v4
        with:
          name: ucrt64-failed-installed-toolchain
          path: ${{ runner.temp }}/ucrt64-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '36224783995'
      - name: test official plugin with repaired host DLL closure
        shell: msys2 {0}
        run: |
          set -uo pipefail
          TEMP_ROOT=$(cygpath -u "$RUNNER_TEMP")
          WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE")
          LOG=$TEMP_ROOT/ucrt64-adjacent-libgcc.log
          : > "$LOG"
          {
            set -e
            ROOT=$TEMP_ROOT/ucrt64-adjacent-installed
            mkdir -p "$ROOT"
            TB2=$(find "$TEMP_ROOT/ucrt64-artifact" -maxdepth 1 -name '*.tb2' -print -quit)
            test -n "$TB2"
            tar -xjf "$TB2" -C "$ROOT"
            TC=$ROOT/x86_64-w64-mingw32-msys2
            RUNTIME=$TC/x86_64-w64-mingw32/runtime
            BEFORE=$(sha256sum "$RUNTIME/libgcc_s_seh-1.dll" | cut -d' ' -f1)
            echo "target runtime libgcc hash before: $BEFORE"
            while IFS= read -r DIR; do
              if [ -f "$DIR/libgcc_s_seh-1.dll" ]; then
                cp -fp /ucrt64/bin/libgcc_s_seh-1.dll "$DIR/libgcc_s_seh-1.dll"
                echo "host libgcc repaired: $DIR"
              fi
            done < <(find "$TC" -type f -iname '*.exe' -printf '%h\n' | sort -u)
            test "$BEFORE" = "$(sha256sum "$RUNTIME/libgcc_s_seh-1.dll" | cut -d' ' -f1)"
            PLUGIN=$(find "$TC/libexec" -name liblto_plugin.dll -print -quit)
            HOST_PLUGIN=$(find /ucrt64/lib/gcc/x86_64-w64-mingw32 -type f -name liblto_plugin.dll -print -quit)
            test -f "$PLUGIN" && test -f "$HOST_PLUGIN"
            echo "packaged plugin $PLUGIN; official plugin $HOST_PLUGIN"
            sha256sum "$PLUGIN" "$HOST_PLUGIN"
            cp -fp "$HOST_PLUGIN" "$PLUGIN"
            echo 'full native smoke with official host libgcc and official plugin; target runtimes unchanged:'
            bash -x "$WORKSPACE/mingw64-smoke.sh" "$TC"
          } 2>&1 | tee "$LOG"
          exit ${PIPESTATUS[0]}
      - name: upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucrt64-adjacent-libgcc-trace
          path: ${{ runner.temp }}/ucrt64-adjacent-libgcc.log
          if-no-files-found: warn
          retention-days: 14
