name: Probe original UCRT CRT half-pair
on:
  push:
    branches: [ diagnose-ucrt-final-smoke ]
    paths: [ .github/workflows/probe-ucrt-crt-half-pair.yml ]
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: mingw-w64-ucrt-x86_64-toolchain bash bzip2 tar
          update: true
          release: false
      - uses: actions/download-artifact@v4
        with:
          name: ucrt64-failed-installed-toolchain
          path: ${{ runner.temp }}/artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '36224783995'
      - shell: msys2 {0}
        run: |
          set -euo pipefail
          ROOT=$(cygpath -u "$RUNNER_TEMP")
          LOG="$ROOT/ucrt-crt-half-pair.log"
          : > "$LOG"
          {
            mkdir -p "$ROOT/half-pair-tc" "$ROOT/half-pair-work"
            tar -xjf "$ROOT/artifact/ucrt64-failed-toolchain.tb2" -C "$ROOT/half-pair-tc"
            TC="$ROOT/half-pair-tc/x86_64-w64-mingw32-msys2"
            LIB="$TC/x86_64-w64-mingw32/lib"
            while IFS= read -r DIR; do
              if [ -f "$DIR/libgcc_s_seh-1.dll" ]; then cp -fp /ucrt64/bin/libgcc_s_seh-1.dll "$DIR/libgcc_s_seh-1.dll"; fi
            done < <(find "$TC" -type f -iname '*.exe' -printf '%h\n' | sort -u)
            export PATH="$TC/bin:/usr/bin"
            unset CC CXX CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH GCC_EXEC_PREFIX COMPILER_PATH
            cd "$ROOT/half-pair-work"
            cat > shared.c <<'EOF'
          __declspec(dllexport) int shared_answer(void) { return 42; }
          EOF
            cat > loader.c <<'EOF'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
            HMODULE dll;
            if (argc != 2) return 2;
            SetErrorMode(SEM_FAILCRITICALERRORS | SEM_NOGPFAULTERRORBOX);
            dll = LoadLibraryA(argv[1]);
            if (!dll) { printf("%s LoadLibrary error=%lu\n", argv[1], (unsigned long)GetLastError()); return 3; }
            printf("%s LoadLibrary success\n", argv[1]);
            FreeLibrary(dll); return 0;
          }
          EOF
            /ucrt64/bin/gcc.exe loader.c -o loader.exe
            cp -p "$LIB/dllcrt2.o" "$ROOT/original-dllcrt2.o"
            cp -p "$LIB/libmingw32.a" "$ROOT/original-libmingw32.a"
            for KIND in original original-object-official-archive official-object-original-archive official-pair; do
              cp -fp "$ROOT/original-dllcrt2.o" "$LIB/dllcrt2.o"
              cp -fp "$ROOT/original-libmingw32.a" "$LIB/libmingw32.a"
              case "$KIND" in
                original-object-official-archive) cp -fp /ucrt64/lib/libmingw32.a "$LIB/libmingw32.a";;
                official-object-original-archive) cp -fp /ucrt64/lib/dllcrt2.o "$LIB/dllcrt2.o";;
                official-pair) cp -fp /ucrt64/lib/dllcrt2.o /ucrt64/lib/libmingw32.a "$LIB/";;
              esac
              echo "=== $KIND ==="
              sha256sum "$LIB/dllcrt2.o" "$LIB/libmingw32.a"
              set +e
              gcc.exe -fno-use-linker-plugin -shared shared.c -o "$KIND.dll" > "$KIND.link.log" 2>&1
              LINK_STATUS=$?
              if [ "$LINK_STATUS" -eq 0 ]; then ./loader.exe "$KIND.dll"; LOAD_STATUS=$?; else cat "$KIND.link.log"; LOAD_STATUS=not-linked; fi
              set -e
              printf '%s link=%s load=%s\n' "$KIND" "$LINK_STATUS" "$LOAD_STATUS"
            done
          } 2>&1 | tee "$LOG"
          exit ${PIPESTATUS[0]}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucrt64-crt-half-pair-log
          path: ${{ runner.temp }}/ucrt-crt-half-pair.log
          if-no-files-found: warn
          retention-days: 14
