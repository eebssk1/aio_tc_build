name: Replay failed UCRT64 installed toolchain

on:
  push:
    branches: [ diagnose-ucrt-final-smoke ]
    paths:
      - .github/workflows/replay-ucrt-failed-toolchain.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: replay-ucrt-failed-toolchain
  cancel-in-progress: true

jobs:
  replay:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: checkout smoke script
        uses: actions/checkout@v4
      - name: setup MSYS shell
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: mingw-w64-ucrt-x86_64-toolchain mingw-w64-x86_64-toolchain bash bzip2 tar gmp-devel mpfr-devel mpc-devel isl-devel zlib-devel libzstd-devel
          update: true
          release: false
      - name: download failed installed toolchain
        uses: actions/download-artifact@v4
        with:
          name: ucrt64-failed-installed-toolchain
          path: ${{ runner.temp }}/ucrt64-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '36224783995'
      - name: run unmodified installed-toolchain smoke with trace
        shell: msys2 {0}
        run: |
          set -euo pipefail
          TEMP_ROOT=$(cygpath -u "$RUNNER_TEMP")
          WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE")
          ARTIFACT_ROOT=$TEMP_ROOT/ucrt64-artifact
          EXTRACT_ROOT=$TEMP_ROOT/ucrt64-installed
          SMOKE_LOG=$TEMP_ROOT/ucrt64-replay-smoke.log
          TB2=$(find "$ARTIFACT_ROOT" -maxdepth 1 -type f -name '*.tb2' -print -quit)
          test -n "$TB2"
          mkdir -p "$EXTRACT_ROOT"
          tar -xjf "$TB2" -C "$EXTRACT_ROOT"
          TOOLCHAIN=$EXTRACT_ROOT/x86_64-w64-mingw32-msys2
          test -d "$TOOLCHAIN"
          echo "Replaying original installed toolchain: $TOOLCHAIN"
          set +e
          bash -x "$WORKSPACE/mingw64-smoke.sh" "$TOOLCHAIN" 2>&1 | tee "$SMOKE_LOG"
          status=${PIPESTATUS[0]}
          set -e
          echo "Original smoke exit status: $status"
          exit "$status"
      - name: diagnose GCC driver loader after original failure
        if: failure()
        shell: msys2 {0}
        run: |
          set -uo pipefail
          TEMP_ROOT=$(cygpath -u "$RUNNER_TEMP")
          BIN=$TEMP_ROOT/ucrt64-installed/x86_64-w64-mingw32-msys2/bin
          LOG=$TEMP_ROOT/ucrt64-replay-smoke.log
          {
            set -x
            echo 'driver and DLL hashes / direct imports:'
            sha256sum "$BIN/gcc.exe" "$BIN/g++.exe" "$BIN/libgcc_s_seh-1.dll" "$BIN/libwinpthread-1.dll" /ucrt64/bin/libgcc_s_seh-1.dll /ucrt64/bin/libwinpthread-1.dll
            /ucrt64/bin/objdump.exe -p "$BIN/gcc.exe" | sed -n 's/.*DLL Name: //p'
            echo 'driver dependencies as resolved by ldd:'
            /usr/bin/timeout --kill-after=5s 20s ldd "$BIN/gcc.exe" || true
            export PATH="$BIN:/usr/bin"
            echo 'packaged driver under isolated PATH:'
            set +e
            gcc.exe -dumpmachine
            echo "gcc status: $?"
            g++.exe -dumpmachine
            echo "g++ status: $?"
            "$BIN/gcc.exe" --version
            echo "absolute gcc status: $?"
            echo 'official UCRT64 driver under isolated PATH:'
            /ucrt64/bin/gcc.exe -dumpmachine
            echo "official gcc status: $?"
            echo 'A/B: replace only host libgcc DLL, then retry (original smoke already failed):'
            cp -fp /ucrt64/bin/libgcc_s_seh-1.dll "$BIN/libgcc_s_seh-1.dll"
            gcc.exe -dumpmachine
            echo "official host libgcc status: $?"
            echo 'A/B: replace also host pthread DLL, then retry:'
            cp -fp /ucrt64/bin/libwinpthread-1.dll "$BIN/libwinpthread-1.dll"
            gcc.exe -dumpmachine
            echo "official host libgcc+pthread status: $?"
            echo 'Other direct driver imports and bundled DLL hashes:'
            /ucrt64/bin/objdump.exe -p "$BIN/gcc.exe" | sed -n 's/.*DLL Name: //p' | while IFS= read -r dll; do
              if [ -f "$BIN/$dll" ]; then sha256sum "$BIN/$dll"; fi
              if [ -f "/ucrt64/bin/$dll" ]; then sha256sum "/ucrt64/bin/$dll"; fi
            done
          } 2>&1 | tee -a "$LOG"
      - name: run complete smoke with repaired host libgcc
        if: failure()
        shell: msys2 {0}
        run: |
          set -uo pipefail
          TEMP_ROOT=$(cygpath -u "$RUNNER_TEMP")
          WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE")
          TOOLCHAIN=$TEMP_ROOT/ucrt64-installed/x86_64-w64-mingw32-msys2
          LOG=$TEMP_ROOT/ucrt64-replay-smoke.log
          cp -fp /ucrt64/bin/libgcc_s_seh-1.dll "$TOOLCHAIN/bin/libgcc_s_seh-1.dll" || exit 1
          echo 'A/B full smoke: repaired host libgcc; target runtime untouched' | tee -a "$LOG"
          bash -x "$WORKSPACE/mingw64-smoke.sh" "$TOOLCHAIN" 2>&1 | tee -a "$LOG"
          status=${PIPESTATUS[0]}
          echo "Repaired host libgcc full smoke status: $status" | tee -a "$LOG"
          exit "$status"
      - name: upload full smoke trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucrt64-replay-smoke-trace
          path: ${{ runner.temp }}/ucrt64-replay-smoke.log
          if-no-files-found: warn
          retention-days: 14
