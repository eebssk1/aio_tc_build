name: Diagnose UCRT64 DLL startup

on:
  push:
    branches: [ diagnose-ucrt-final-smoke ]
    paths: [ .github/workflows/replay-ucrt-dll-startup.yml ]

permissions:
  actions: read
  contents: read

jobs:
  dll-startup:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: mingw-w64-ucrt-x86_64-toolchain mingw-w64-x86_64-toolchain bash bzip2 tar gmp-devel mpfr-devel mpc-devel isl-devel zlib-devel libzstd-devel
          update: true
          release: false
      - uses: actions/download-artifact@v4
        with:
          name: ucrt64-failed-installed-toolchain
          path: ${{ runner.temp }}/ucrt64-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '36224783995'
      - name: A/B DLL startup object under Windows
        shell: msys2 {0}
        run: |
          set -euo pipefail
          TEMP_ROOT=$(cygpath -u "$RUNNER_TEMP")
          LOG=$TEMP_ROOT/ucrt64-dll-startup.log
          : > "$LOG"
          {
            ROOT=$TEMP_ROOT/ucrt64-dll-startup-ab
            mkdir -p "$ROOT"
            TB2=$(find "$TEMP_ROOT/ucrt64-artifact" -maxdepth 1 -name '*.tb2' -print -quit)
            test -n "$TB2"
            tar -xjf "$TB2" -C "$ROOT"
            TC=$ROOT/x86_64-w64-mingw32-msys2
            RUNTIME=$TC/x86_64-w64-mingw32/runtime
            while IFS= read -r DIR; do
              if [ -f "$DIR/libgcc_s_seh-1.dll" ]; then cp -fp /ucrt64/bin/libgcc_s_seh-1.dll "$DIR/libgcc_s_seh-1.dll"; fi
            done < <(find "$TC" -type f -iname '*.exe' -printf '%h\n' | sort -u)
            PLUGIN=$(find "$TC/libexec" -name liblto_plugin.dll -print -quit)
            HOST_PLUGIN=$(find /ucrt64/lib/gcc/x86_64-w64-mingw32 -type f -name liblto_plugin.dll -print -quit)
            cp -fp "$HOST_PLUGIN" "$PLUGIN"
            export PATH="$TC/bin:/usr/bin"
            unset CC CXX CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH GCC_EXEC_PREFIX COMPILER_PATH
            WORK=$TEMP_ROOT/ucrt64-dll-object-probe
            mkdir -p "$WORK"
            cd "$WORK"
            cp -p "$RUNTIME"/*.dll .
            for DLL in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do cp -fp "/ucrt64/bin/$DLL" .; done
            cat > shared.c <<'EOF'
          __declspec(dllexport) int shared_answer(void) { return 42; }
          EOF
            cat > main.c <<'EOF'
          #include <stdio.h>
          __declspec(dllimport) int shared_answer(void);
          int main(void) { if (shared_answer()!=42) return 1; puts("dll-ok"); return 0; }
          EOF
            OFFICIAL_START=$(/ucrt64/bin/gcc.exe -print-file-name=dllcrt2.o)
            PACKAGED_START=$(gcc.exe -print-file-name=dllcrt2.o)
            echo "packaged startup: $PACKAGED_START"
            echo "official startup: $OFFICIAL_START"
            test -f "$PACKAGED_START" && test -f "$OFFICIAL_START"
            sha256sum "$PACKAGED_START" "$OFFICIAL_START"
            cp -p "$PACKAGED_START" packaged-dllcrt2.o
            gcc.exe -shared shared.c -Wl,--out-implib,libcustom.dll.a -o custom.dll
            gcc.exe main.c -L. -lcustom -o custom-client.exe
            cp -fp "$OFFICIAL_START" "$PACKAGED_START"
            gcc.exe -shared shared.c -Wl,--out-implib,libswapped.dll.a -o swapped.dll
            gcc.exe main.c -L. -lswapped -o swapped-client.exe
            /ucrt64/bin/gcc.exe -shared shared.c -Wl,--out-implib,libofficial.dll.a -o official.dll
            gcc.exe main.c -L. -lofficial -o official-client.exe
            for FILE in custom.dll swapped.dll official.dll; do
              echo "=== $FILE entrypoint/imports ==="
              /ucrt64/bin/objdump.exe -p "$FILE" | sed -n '/AddressOfEntryPoint/p;/DLL Name:/p'
            done
            for EXE in custom-client.exe swapped-client.exe official-client.exe; do
              set +e
              OUTPUT=$(./"$EXE" 2>&1)
              STATUS=$?
              set -e
              printf '%s exit=%s output=<%s>\n' "$EXE" "$STATUS" "$OUTPUT"
            done
          } 2>&1 | tee "$LOG"
          exit ${PIPESTATUS[0]}
      - name: upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucrt64-dll-startup-trace
          path: ${{ runner.temp }}/ucrt64-dll-startup.log
          if-no-files-found: warn
          retention-days: 14
