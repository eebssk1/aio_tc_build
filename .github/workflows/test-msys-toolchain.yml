name: Test MSYS2 toolchain artifacts

on:
  push:
    branches: [ "main" ]
    paths:
      - "mingw64-smoke.sh"
      - "mingw64-runtime-dlls.sh"
      - ".github/workflows/test-msys-toolchain.yml"
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI run ID containing result_mingw64-msys2 artifacts'
        required: false
        default: '36098754540'
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: test-msys-toolchain-artifacts
  cancel-in-progress: true

jobs:
  cleanup-stale-runs:
    runs-on: ubuntu-latest
    steps:
      - name: cancel stale smoke and build runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          current_run_id = int(os.environ['CURRENT_RUN_ID'])
          current_sha = os.environ['CURRENT_SHA']
          token = os.environ['GH_TOKEN']
          workflows = ('test-msys-toolchain.yml', 'build.yml')
          base = f'https://api.github.com/repos/{repository}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          for workflow in workflows:
              request = urllib.request.Request(
                  f'{base}/actions/workflows/{workflow}/runs?per_page=100',
                  headers=headers,
              )
              with urllib.request.urlopen(request) as response:
                  runs = json.load(response)['workflow_runs']

              for run in runs:
                  run_id = int(run['id'])
                  if run_id >= current_run_id or run['head_sha'] == current_sha:
                      continue
                  if run['status'] not in {'queued', 'in_progress'}:
                      continue
                  print(
                      f"cancelling stale {workflow} run {run_id} "
                      f"({run['status']}, {run['head_sha'][:8]})"
                  )
                  for attempt in range(1, 5):
                      cancel = urllib.request.Request(
                          f'{base}/actions/runs/{run_id}/cancel',
                          data=b'',
                          headers=headers,
                          method='POST',
                      )
                      try:
                          with urllib.request.urlopen(cancel) as response:
                              print(f'cancel status: {response.status}')
                          break
                      except urllib.error.HTTPError as error:
                          if error.code == 409:
                              print(f'run {run_id} already finished')
                              break
                          rate_limited = (
                              error.code == 429
                              or error.headers.get('Retry-After') is not None
                              or error.headers.get('X-RateLimit-Remaining') == '0'
                          )
                          retryable = rate_limited or error.code in {500, 502, 503, 504}
                          if retryable and attempt < 4:
                              delay = int(error.headers.get('Retry-After', 5 * attempt))
                              print(
                                  f'cancel run {run_id} returned HTTP {error.code}; '
                                  f'retrying in {delay}s'
                              )
                              time.sleep(delay)
                              continue
                          detail = error.read().decode('utf-8', errors='replace')
                          print(
                              f'warning: could not cancel run {run_id}: '
                              f'HTTP {error.code}: {detail}'
                          )
                          break
                      finally:
                          time.sleep(1)
          PY

  smoke:
    needs: cleanup-stale-runs
    if: always()
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: result_mingw64-msys2
            root: x86_64-w64-mingw32-msys2
            host_prefix: /ucrt64
          - artifact: result_mingw64-msys2-ms
            root: x86_64-w64-mingw32-msys2_ms
            host_prefix: /mingw64

    steps:
      - name: checkout tests
        uses: actions/checkout@v4

      - name: setup MSYS shell
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: mingw-w64-ucrt-x86_64-toolchain mingw-w64-x86_64-toolchain bash bzip2 tar gmp-devel mpfr-devel mpc-devel isl-devel zlib-devel libzstd-devel
          update: true
          release: false

      - name: download toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/toolchain-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id || '36098754540' }}

      - name: extract and test installed toolchain
        shell: msys2 {0}
        run: |
          set -uo pipefail
          TEMP_ROOT=$(cygpath -u "$RUNNER_TEMP")
          WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE")
          ARTIFACT_ROOT=$TEMP_ROOT/toolchain-artifact
          EXTRACT_ROOT=$TEMP_ROOT/toolchain-smoke
          SMOKE_LOG=$TEMP_ROOT/smoke-${{ matrix.artifact }}.log
          TB2=$(find "$ARTIFACT_ROOT" -maxdepth 1 -type f -name '*.tb2' -print -quit)
          test -n "$TB2"
          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"
          tar -xjf "$TB2" -C "$EXTRACT_ROOT"
          TOOLCHAIN=$EXTRACT_ROOT/${{ matrix.root }}

          {
            set -x
            bash "$WORKSPACE/mingw64-runtime-dlls.sh" "$TOOLCHAIN" \
              "${{ matrix.host_prefix }}" &&
            bash -x "$WORKSPACE/mingw64-smoke.sh" "$TOOLCHAIN"
          } 2>&1 | tee "$SMOKE_LOG"
          exit ${PIPESTATUS[0]}

      - name: diagnose UCRT64 linker plugin failure
        if: failure() && matrix.host_prefix == '/ucrt64'
        timeout-minutes: 6
        shell: msys2 {0}
        run: |
          set -uo pipefail
          set +e
          TEMP_ROOT=$(cygpath -u "$RUNNER_TEMP")
          WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE")
          TOOLCHAIN=$TEMP_ROOT/toolchain-smoke/${{ matrix.root }}
          BIN=$TOOLCHAIN/bin
          SMOKE_LOG=$TEMP_ROOT/smoke-${{ matrix.artifact }}.log
          WORK=$TEMP_ROOT/plugin-diagnostic
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"

          export PATH="$BIN:/usr/bin"
          unset CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH
          unset GCC_EXEC_PREFIX COMPILER_PATH

          cat > smoke.c <<'EOF'
          int main(void)
          {
            return 0;
          }
          EOF

          {
            set -x
            gcc.exe -fno-use-linker-plugin -c smoke.c -o smoke.o
            LD=$(gcc.exe -print-prog-name=ld)
            CC1=$(gcc.exe -print-prog-name=cc1)
            PLUGIN=$(dirname "$CC1")/liblto_plugin.dll
            HOST_LD=/ucrt64/bin/ld.exe
            HOST_PLUGIN=$(find /ucrt64/lib/gcc/x86_64-w64-mingw32 \
              -type f -name liblto_plugin.dll -print -quit)
            test -x "$LD"
            test -f "$PLUGIN"
            test -x "$HOST_LD"
            test -f "$HOST_PLUGIN"

            echo "packaged ld: $LD"
            echo "packaged cc1: $CC1"
            echo "packaged plugin: $PLUGIN"
            echo "official ld: $HOST_LD"
            echo "official plugin: $HOST_PLUGIN"
            sha256sum "$LD" "$PLUGIN" "$HOST_LD" "$HOST_PLUGIN"
            /usr/bin/timeout --kill-after=5s 20s ldd "$LD" || true
            /usr/bin/timeout --kill-after=5s 20s ldd "$PLUGIN" || true
            /usr/bin/timeout --kill-after=5s 20s ldd "$HOST_LD" || true
            /usr/bin/timeout --kill-after=5s 20s ldd "$HOST_PLUGIN" || true

            try_link()
            {
              LABEL=$1
              shift
              rm -f "$LABEL.exe"
              set +e
              /usr/bin/timeout --kill-after=5s 30s \
                gcc.exe -v "$@" smoke.o -o "$LABEL.exe"
              STATUS=$?
              set -e
              echo "$LABEL status: $STATUS"
              if [ "$STATUS" = 0 ]; then
                test -x "$LABEL.exe"
                "./$LABEL.exe"
              fi
            }

            cp -p "$PLUGIN" packaged-plugin.dll
            try_link packaged-ld-packaged-plugin

            cp -fp "$HOST_PLUGIN" "$PLUGIN"
            try_link packaged-ld-official-plugin

            cp -fp packaged-plugin.dll "$PLUGIN"
            HOST_BIN_WIN=$(cygpath -am /ucrt64/bin)
            try_link official-ld-packaged-plugin "-B$HOST_BIN_WIN/"

            cp -fp "$HOST_PLUGIN" "$PLUGIN"
            try_link official-ld-official-plugin "-B$HOST_BIN_WIN/"

            set +e
            bash -x "$WORKSPACE/mingw64-smoke.sh" "$TOOLCHAIN"
            FULL_SMOKE_STATUS=$?
            set -e
            echo "official-plugin-full-smoke status: $FULL_SMOKE_STATUS"

            if [ "$FULL_SMOKE_STATUS" != 0 ]; then
              TARGET_RUNTIME=$TOOLCHAIN/x86_64-w64-mingw32/runtime
              CXX_WORK=$WORK/cxx-runtime-diagnostic
              rm -rf "$CXX_WORK"
              mkdir -p "$CXX_WORK/custom"
              cp -p "$TARGET_RUNTIME"/*.dll "$CXX_WORK/custom/"
              cp -p "$CXX_WORK/custom"/*.dll "$CXX_WORK/"
              cd "$CXX_WORK"

              cat > smoke.cc <<'EOF'
          #include <iostream>
          #include <numeric>
          #include <vector>

          int main()
          {
            const std::vector<int> values{1, 2, 3, 4};
            if (std::accumulate(values.begin(), values.end(), 0) != 10)
              return 1;
            std::cout << "cxx-ok\n";
            return 0;
          }
          EOF

              g++.exe -std=c++20 -O2 -Wall -Wextra -Werror \
                smoke.cc -o runtime-smoke.exe
              echo "runtime-smoke.exe imports:"
              objdump.exe -p runtime-smoke.exe |
                sed -n 's/.*DLL Name: //p' | sort -fu

              try_cxx_runtime()
              {
                LABEL=$1
                echo "$LABEL runtime hashes:"
                sha256sum libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll
                /usr/bin/timeout --kill-after=5s 20s ldd runtime-smoke.exe || true
                set +e
                OUTPUT=$(./runtime-smoke.exe 2>&1)
                STATUS=$?
                set -e
                printf '%s status: %s output: <%s>\n' "$LABEL" "$STATUS" "$OUTPUT"
              }

              try_cxx_runtime custom-target-runtime
              cp -fp /ucrt64/bin/libwinpthread-1.dll .
              try_cxx_runtime official-pthread
              cp -fp /ucrt64/bin/libgcc_s_seh-1.dll .
              try_cxx_runtime official-gcc-pthread
              cp -fp /ucrt64/bin/libstdc++-6.dll .
              try_cxx_runtime official-cxx-runtime
            fi

            cp -fp "$WORK/packaged-plugin.dll" "$PLUGIN"
          } 2>&1 | tee -a "$SMOKE_LOG"

      - name: upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.artifact }}
          path: ${{ runner.temp }}/smoke-${{ matrix.artifact }}.log
          if-no-files-found: error
