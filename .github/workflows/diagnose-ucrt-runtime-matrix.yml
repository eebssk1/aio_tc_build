name: Diagnose UCRT64 DLL startup

on:
  push:
    branches: [ "diagnose-ucrt-runtime-matrix" ]
    paths:
      - ".github/workflows/diagnose-ucrt-runtime-matrix.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: diagnose-ucrt-dll-startup
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: checkout diagnostic
        uses: actions/checkout@v4

      - name: setup MSYS shell
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: mingw-w64-ucrt-x86_64-toolchain bash bzip2 curl tar zstd
          update: true
          release: false

      - name: download old UCRT64 toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: result_mingw64-msys2
          path: ${{ runner.temp }}/toolchain-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '36098754540'

      - name: build DLL startup component combinations
        shell: msys2 {0}
        run: |
          set -uo pipefail
          TEMP_ROOT=$(cygpath -u "$RUNNER_TEMP")
          WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE")
          ARTIFACT_ROOT=$TEMP_ROOT/toolchain-artifact
          EXTRACT_ROOT=$TEMP_ROOT/toolchain-startup-ab
          REFERENCE_ROOT=$TEMP_ROOT/msys2-crt-reference
          LOG=$TEMP_ROOT/ucrt-dll-startup-ab.log
          TB2=$(find "$ARTIFACT_ROOT" -maxdepth 1 -type f -name '*.tb2' -print -quit)
          test -n "$TB2" || exit 1
          rm -rf "$EXTRACT_ROOT" "$REFERENCE_ROOT"
          mkdir -p "$EXTRACT_ROOT" "$REFERENCE_ROOT"
          tar -xjf "$TB2" -C "$EXTRACT_ROOT" || exit 1

          CRT_PACKAGE=$TEMP_ROOT/mingw-w64-ucrt-x86_64-crt-14.0.0.r248.g7735a1a63-1-any.pkg.tar.zst
          curl --fail --location --retry 3 --output "$CRT_PACKAGE" \
            https://mirror.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-crt-14.0.0.r248.g7735a1a63-1-any.pkg.tar.zst || exit 1
          printf '%s  %s\n' \
            3b69de2a2a5a99c49601165feae2c76a3abd9ffbae61c67437919eb08469e5b1 \
            "$CRT_PACKAGE" | sha256sum --check || exit 1
          tar --zstd -xf "$CRT_PACKAGE" -C "$REFERENCE_ROOT" || exit 1

          TOOLCHAIN=$EXTRACT_ROOT/x86_64-w64-mingw32-msys2
          bash "$WORKSPACE/mingw64-runtime-dlls.sh" "$TOOLCHAIN" /ucrt64 || exit 1
          BIN=$TOOLCHAIN/bin
          CUSTOM_LIB=$TOOLCHAIN/x86_64-w64-mingw32/lib
          OFFICIAL_LIB=$REFERENCE_ROOT/ucrt64/lib
          WORK=$TEMP_ROOT/dll-startup-ab-work
          rm -rf "$WORK"
          mkdir -p "$WORK/original"
          cd "$WORK" || exit 1

          unset CC CXX CFLAGS CXXFLAGS CPPFLAGS LDFLAGS
          unset CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH
          unset GCC_EXEC_PREFIX COMPILER_PATH

          cat > probe.c <<'EOF'
          #include <windows.h>

          static volatile LONG state;

          __attribute__((constructor))
          static void probe_ctor(void)
          {
            InterlockedIncrement(&state);
          }

          __attribute__((destructor))
          static void probe_dtor(void)
          {
            InterlockedDecrement(&state);
          }

          __declspec(dllexport) int probe_state(void)
          {
            return (int)state;
          }
          EOF

          {
            set -x
            printf '%s\n' '=== component locations and hashes ==='
            "$BIN/gcc.exe" -print-file-name=dllcrt2.o || true
            "$BIN/gcc.exe" -print-file-name=libmingw32.a || true
            ls -l "$CUSTOM_LIB/dllcrt2.o" "$CUSTOM_LIB/libmingw32.a" \
                  "$OFFICIAL_LIB/dllcrt2.o" "$OFFICIAL_LIB/libmingw32.a"
            sha256sum "$CUSTOM_LIB/dllcrt2.o" "$CUSTOM_LIB/libmingw32.a" \
                      "$OFFICIAL_LIB/dllcrt2.o" "$OFFICIAL_LIB/libmingw32.a"

            cp -fp "$CUSTOM_LIB/dllcrt2.o" "$WORK/original/dllcrt2.o"
            cp -fp "$CUSTOM_LIB/libmingw32.a" "$WORK/original/libmingw32.a"

            restore_custom()
            {
              cp -fp "$WORK/original/dllcrt2.o" "$CUSTOM_LIB/dllcrt2.o"
              cp -fp "$WORK/original/libmingw32.a" "$CUSTOM_LIB/libmingw32.a"
            }
            trap restore_custom EXIT

            select_component()
            {
              KIND=$1
              FILE=$2
              if test "$KIND" = custom; then
                cp -fp "$WORK/original/$FILE" "$CUSTOM_LIB/$FILE"
              else
                cp -fp "$OFFICIAL_LIB/$FILE" "$CUSTOM_LIB/$FILE"
              fi
            }

            build_probe()
            {
              LABEL=$1
              DLLCRT_KIND=$2
              MINGW_KIND=$3
              select_component "$DLLCRT_KIND" dllcrt2.o
              select_component "$MINGW_KIND" libmingw32.a
              echo "=== build $LABEL dllcrt=$DLLCRT_KIND libmingw32=$MINGW_KIND ==="
              sha256sum "$CUSTOM_LIB/dllcrt2.o" "$CUSTOM_LIB/libmingw32.a"
              "$BIN/gcc.exe" -fno-use-linker-plugin -O0 -g0 -shared \
                -Wl,--no-insert-timestamp probe.c -o "probe-$LABEL.dll" \
                >"build-$LABEL.log" 2>&1
              STATUS=$?
              printf 'build %s status: %s\n' "$LABEL" "$STATUS"
              cat "build-$LABEL.log"
              if test "$STATUS" -eq 0; then
                sha256sum "probe-$LABEL.dll"
                /ucrt64/bin/objdump.exe -p "probe-$LABEL.dll" |
                  sed -n '/The Import Tables/,/The Function Table/p' || true
              else
                rm -f "probe-$LABEL.dll"
              fi
            }

            build_probe CC custom custom
            build_probe CO custom official
            build_probe OC official custom
            build_probe OO official official
            restore_custom
            trap - EXIT
          } 2>&1 | tee "$LOG"

      - name: test DLLs with native Windows loader
        if: always()
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'dll-startup-ab-work'
          $log = Join-Path $env:RUNNER_TEMP 'ucrt-dll-startup-ab.log'
          @'
          import _ctypes
          import ctypes
          from pathlib import Path

          work = Path(__import__('os').environ['RUNNER_TEMP']) / 'dll-startup-ab-work'
          failed = False
          print('=== native ctypes.WinDLL results ===')
          for label in ('CC', 'CO', 'OC', 'OO'):
              path = work / f'probe-{label}.dll'
              if not path.exists():
                  print(f'load {label} skipped: DLL was not built')
                  failed = True
                  continue
              try:
                  module = ctypes.WinDLL(str(path), use_last_error=True)
              except OSError as error:
                  print(f'load {label} failed winerror={error.winerror} error=<{error}>')
                  failed = True
                  continue
              function = module.probe_state
              function.argtypes = []
              function.restype = ctypes.c_int
              state = function()
              print(f'load {label} ok ctor-state={state}')
              if state != 1:
                  failed = True
              handle = module._handle
              del function
              del module
              _ctypes.FreeLibrary(handle)
              print(f'unload {label} ok')
          print(f'native-result={"failure" if failed else "success"}')
          '@ | python - 2>&1 | Tee-Object -FilePath $log -Append

      - name: upload DLL startup A-B log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucrt-dll-startup-ab-log
          path: ${{ runner.temp }}/ucrt-dll-startup-ab.log
          if-no-files-found: error
