name: Reciprocal UCRT interposition probe
on:
  push:
    branches: [ diagnose-ucrt-final-smoke ]
    paths: [ .github/workflows/probe-ucrt-interposition.yml ]
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: mingw-w64-ucrt-x86_64-toolchain bash bzip2 tar python
          update: true
          release: false
      - uses: actions/download-artifact@v4
        with:
          name: ucrt64-failed-installed-toolchain
          path: ${{ runner.temp }}/artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '36224783995'
      - shell: msys2 {0}
        run: |
          set -euo pipefail
          ROOT=$(cygpath -u "$RUNNER_TEMP")
          LOG=$ROOT/ucrt-interposition.log
          : > "$LOG"
          {
            mkdir -p "$ROOT/interposition-tc" "$ROOT/interposition-work/source"
            tar -xjf "$ROOT/artifact/ucrt64-failed-toolchain.tb2" -C "$ROOT/interposition-tc"
            TC=$ROOT/interposition-tc/x86_64-w64-mingw32-msys2
            LIB=$TC/x86_64-w64-mingw32/lib
            SRC=$ROOT/interposition-work/source
            BASE=https://raw.githubusercontent.com/mingw-w64/mingw-w64/4564ee4b5/mingw-w64-crt
            for NAME in crt/crtdll.c include/internal.h include/sect_attribs.h; do curl -fsSL --retry 3 "$BASE/$NAME" -o "$SRC/${NAME##*/}"; done
            printf '%s  %s\n' \
              '6ebc176a18c1e448528dddd0604587ba18adc48dd2cc312c5edbc4311c4ff24c' "$SRC/crtdll.c" \
              '862e7c001b31867db98eefabd82a751f5c3809aee22cca1faee6d6f57cd361b9' "$SRC/internal.h" \
              '2bb9e4ceee95a88cf6e97301319d5d3b78d57d12c57ec9f830af5d510a82fadc' "$SRC/sect_attribs.h" | sha256sum -c -
            python3 - "$SRC/crtdll.c" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);s=p.read_text()
          for old,new in [
            ('extern void __cdecl __mingw_dll_do_global_ctors (void);\nextern void __cdecl __mingw_dll_do_global_dtors (void);','extern void __main ();'),
            ('__mingw_dll_do_global_ctors ();','__main ();'),
            ('__mingw_dll_do_global_dtors ();','')]:
            if s.count(old)!=1: raise SystemExit('unexpected upstream CRT source')
            s=s.replace(old,new)
          p.write_text(s)
          PY
            while IFS= read -r DIR; do
              if [ -f "$DIR/libgcc_s_seh-1.dll" ]; then cp -fp /ucrt64/bin/libgcc_s_seh-1.dll "$DIR/libgcc_s_seh-1.dll"; fi
            done < <(find "$TC" -type f -iname '*.exe' -printf '%h\n' | sort -u)
            export PATH="$TC/bin:/usr/bin"
            unset CC CXX CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH GCC_EXEC_PREFIX COMPILER_PATH
            cd "$ROOT/interposition-work"
            cat > shared.c <<'EOF'
          __declspec(dllexport) int shared_answer(void) { return 42; }
          EOF
            cat > loader.c <<'EOF'
          #include <windows.h>
          #include <stdio.h>
          int main(int argc,char **argv) {
            HMODULE h;
            if(argc!=2)return 2;
            SetErrorMode(SEM_FAILCRITICALERRORS|SEM_NOGPFAULTERRORBOX);
            h=LoadLibraryA(argv[1]);
            if(!h){printf("%s error=%lu\n",argv[1],(unsigned long)GetLastError());return 3;}
            printf("%s loaded\n",argv[1]);FreeLibrary(h);return 0;
          }
          EOF
            /ucrt64/bin/gcc.exe loader.c -o loader.exe
            for KIND in host-default host-no-interposition self-default self-interposition self-interposition-O1 self-interposition-O3 self-interposition-haswell; do
              echo "=== $KIND ==="
              CC=$TC/bin/gcc.exe; OPT=(-O2)
              case "$KIND" in
                host-default) CC=/ucrt64/bin/gcc.exe;;
                host-no-interposition) CC=/ucrt64/bin/gcc.exe; OPT+=(-fno-semantic-interposition);;
                self-interposition) OPT+=(-fsemantic-interposition);;
                self-interposition-O1) OPT=(-O1 -fsemantic-interposition);;
                self-interposition-O3) OPT=(-O3 -fsemantic-interposition);;
                self-interposition-haswell) OPT+=(-fsemantic-interposition -march=haswell -mtune=skylake);;
              esac
              "$CC" -v -c "$SRC/crtdll.c" -I"$SRC" -I"$TC/x86_64-w64-mingw32/include" -D_SYSCRT=1 "${OPT[@]}" -o "$KIND.o" > "$KIND.compile.log" 2>&1 || { cat "$KIND.compile.log"; exit 1; }
              grep 'COLLECT_GCC_OPTIONS=' "$KIND.compile.log" | head -1 || :
              cp -fp "$KIND.o" "$LIB/dllcrt2.o"
              sha256sum "$LIB/dllcrt2.o"
              set +e
              gcc.exe -fno-use-linker-plugin -shared shared.c -o "$KIND.dll" > "$KIND.link.log" 2>&1
              LINK_STATUS=$?
              if [ "$LINK_STATUS" -eq 0 ]; then ./loader.exe "$KIND.dll"; LOAD_STATUS=$?; else cat "$KIND.link.log"; LOAD_STATUS=not-linked; fi
              set -e
              printf '%s link=%s load=%s\n' "$KIND" "$LINK_STATUS" "$LOAD_STATUS"
            done
          } 2>&1 | tee "$LOG"
          exit ${PIPESTATUS[0]}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucrt-interposition-log
          path: ${{ runner.temp }}/ucrt-interposition.log
          if-no-files-found: warn
          retention-days: 14
